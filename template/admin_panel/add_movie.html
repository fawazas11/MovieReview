
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Movie | MovieReview</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f5f9;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h2 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .back {
    display: inline-block;
    margin-bottom: 20px;
    color: #333;
    text-decoration: none;
    font-weight: bold;
}

.back:hover {
    color: #e50914;
}

.dashboard-btn {
    display: inline-block;
    padding: 10px 18px;
    background: #333;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    margin-bottom: 20px;
    float: right;
}

.dashboard-btn:hover {
    background: #e50914;
}

        .errorlist {
            color: red;
        }

        .movies-btn {
    display: inline-block;
    padding: 10px 18px;
    background: #333;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    margin-top: 20px;
    transition: 0.3s;
}

.movies-btn:hover {
    background: #e50914;
}
    </style>
</head>

<body>

<div class="container">

    <a href="{% url 'admin_dashboard' %}" class="dashboard-btn">
    ← Back to Dashboard
</a>

    <h2>Add New Movie</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Movie</button>
    </form>

    <a href="{% url 'admin_manage_movies' %}" class="movies-btn">
        Back to Movies
    </a>

</div>

</body>
</html>
