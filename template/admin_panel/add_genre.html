
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Genre | Admin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 16px;
            margin-bottom: 25px;
            background: white;
            color: #444;
            border: 1px solid #e0e0e0;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            transition: 0.2s;
        }

        .back-link:hover {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 27px;
            color: #222;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #777;
            font-size: 14px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #e8e8e8;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .form-card h2 {
            font-size: 19px;
            margin-bottom: 25px;
            color: #333;
        }

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
            color: #444;
        }

        form input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dcdfe5;
            border-radius: 6px;
            background: white;
            color: #333;
            font-size: 14px;
            outline: none;
        }

        form input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .errorlist {
            color: #dc3545;
            font-size: 13px;
            padding-left: 20px;
            margin: 6px 0;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #eee;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .save-btn {
            background: #007bff;
            color: white;
        }

        .save-btn:hover {
            background: #0069d9;
        }

        .cancel-btn {
            background: #e9ecef;
            color: #444;
        }

        .cancel-btn:hover {
            background: #dce0e4;
        }

        @media (max-width: 600px) {
            .form-card {
                padding: 22px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="{% url 'admin_manage_genres' %}" class="back-link">
        ← Manage Genres
    </a>

    <div class="page-header">
        <h1>Add New Genre</h1>
        <p>Create a new genre for your MovieReview website.</p>
    </div>

    <div class="form-card">

        <h2>Genre Information</h2>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit" class="btn save-btn">
                    Save Genre
                </button>

                <a href="{% url 'admin_manage_genres' %}" class="btn cancel-btn">
                    Cancel
                </a>
            </div>
        </form>

    </div>

</div>

</body>
</html>
