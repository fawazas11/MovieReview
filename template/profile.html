
{% extends 'user_base.html' %}

{% block title %}My Profile | MovieReview{% endblock %}

{% block content %}

<div class="profile-container">

    <h1>My Profile</h1>
    <p class="profile-subtitle">Manage your account information and password.</p>

    <div class="profile-card">

        <h2>Account Information</h2>

        <div class="profile-field">
            <label>Username</label>
            <input type="text" value="{{ request.user.username }}" readonly>
        </div>

        <div class="profile-field">
            <label>Email Address</label>
            <input type="email" value="{{ request.user.email }}" readonly>
        </div>

        <hr>

        <h2>Change Password</h2>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="profile-save-btn">
                Change Password
            </button>
        </form>

    </div>

</div>

{% endblock %}
